<header class="cabecera" [class.cabecera--scrolled]="isScrolled()">
  <div class="contenedor cabecera__contenedor">
    
    <!-- Logotipo Corporativo con Imagen Original -->
    <a routerLink="/" (click)="closeMenu()" class="cabecera__logo" aria-label="Ir a Inicio - Pranalab">
      <img src="/assets/images/logo.png" 
           alt="Pranalab - Simplemente Natural" 
           class="cabecera__logo-img" />
    </a>

    <!-- Navegación Principal de Escritorio -->
    <nav class="cabecera__navegacion" aria-label="Menú principal">
      <ul class="cabecera__lista">
        <li class="cabecera__item">
          <a routerLink="/" 
             routerLinkActive="activo" 
             [routerLinkActiveOptions]="{ exact: true }" 
             class="cabecera__enlace">
            Inicio
          </a>
        </li>
        <li class="cabecera__item">
          <a routerLink="/nosotros" 
             routerLinkActive="activo" 
             class="cabecera__enlace">
            Nosotros
          </a>
        </li>
        <li class="cabecera__item">
          <a routerLink="/catalogo" 
             routerLinkActive="activo" 
             class="cabecera__enlace">
            Catálogo
          </a>
        </li>
        <li class="cabecera__item">
          <a routerLink="/contacto" 
             routerLinkActive="activo" 
             class="cabecera__enlace">
            Contacto
          </a>
        </li>
      </ul>
    </nav>

    <!-- Acciones y Redes Sociales a la Derecha -->
    <div class="cabecera__acciones">
      <div class="redes-sociales" aria-label="Redes de contacto">
        <!-- Instagram -->
        <a href="https://www.instagram.com/pranalabchile/" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="red-icono" 
           title="Síguenos en Instagram (@pranalabchile)" 
           aria-label="Instagram de Pranalab">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>


        <!-- WhatsApp -->
        <a href="https://wa.me/56936264950" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="red-icono red-icono--whatsapp" 
           title="Contacto comercial por WhatsApp (+56 9 3626 4950)" 
           aria-label="WhatsApp comercial Pranalab">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
          </svg>
        </a>
      </div>

      <!-- Botón de Hamburguesa para Móvil -->
      <button type="button" 
              class="boton-hamburguesa" 
              [class.abierto]="isMenuOpen()" 
              (click)="toggleMenu()" 
              aria-label="Abrir menú de navegación"
              [attr.aria-expanded]="isMenuOpen()">
        <span class="linea"></span>
        <span class="linea"></span>
        <span class="linea"></span>
      </button>
    </div>

  </div>

  <!-- Menú Desplegable Móvil -->
  <div class="cabecera__movil" [class.abierto]="isMenuOpen()">
    <nav class="cabecera__movil-nav" aria-label="Navegación móvil">
      <ul class="cabecera__movil-lista">
        <li>
          <a routerLink="/" 
             routerLinkActive="activo" 
             [routerLinkActiveOptions]="{ exact: true }" 
             (click)="closeMenu()" 
             class="cabecera__movil-enlace">
            Inicio
          </a>
        </li>
        <li>
          <a routerLink="/nosotros" 
             routerLinkActive="activo" 
             (click)="closeMenu()" 
             class="cabecera__movil-enlace">
            Nosotros
          </a>
        </li>
        <li>
          <a routerLink="/catalogo" 
             routerLinkActive="activo" 
             (click)="closeMenu()" 
             class="cabecera__movil-enlace">
            Catálogo
          </a>
        </li>
        <li>
          <a routerLink="/contacto" 
             routerLinkActive="activo" 
             (click)="closeMenu()" 
             class="cabecera__movil-enlace">
            Contacto
          </a>
        </li>
      </ul>

      <div class="cabecera__movil-redes">
        <span class="cabecera__movil-redes-titulo">Canales de Atención y Contacto:</span>
        <div class="redes-sociales">
          <a href="https://www.instagram.com/pranalabchile/" target="_blank" rel="noopener noreferrer" class="red-icono" aria-label="Instagram (@pranalabchile)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="https://wa.me/56936264950" target="_blank" rel="noopener noreferrer" class="red-icono red-icono--whatsapp" aria-label="WhatsApp Comercial (+56 9 3626 4950)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
            </svg>
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>
